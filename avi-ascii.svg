<svg xmlns="http://www.w3.org/2000/svg" width="820" height="845" viewBox="0 0 820 845" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#111722"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
</defs>
<rect width="820" height="845" rx="12" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="819" height="844" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
<line x1="0" y1="30" x2="820" y2="30" stroke="#30363d"/>
<circle cx="20" cy="15" r="5" fill="#ff5f56"/>
<circle cx="36" cy="15" r="5" fill="#ffbd2e"/>
<circle cx="52" cy="15" r="5" fill="#27c93f"/>
<text x="410" y="19" fill="#7d8590" font-size="12" text-anchor="middle">avi@github: ~$ ./portrait.sh</text>

<!-- ASCII art placeholder grid -->
<text x="20" y="60" fill="#3fb950" font-size="13" font-weight="700" opacity="0">
  <tspan>Add your portrait</tspan>
  <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.5s" fill="freeze"/>
</text>

<!-- Decorative terminal "loading" ASCII block -->
<text xml:space="preserve" x="20" y="80" fill="#c9d1d9" font-size="10.5" opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.4s" fill="freeze"/>
  <tspan x="20" dy="0">  ██████╗  ██████╗ ██████╗ ████████╗██████╗  █████╗ ██╗████████╗</tspan>
  <tspan x="20" dy="14"> ██╔══██╗██╔═══██╗██╔══██╗╚══██╔══╝██╔══██╗██╔══██╗██║╚══██╔══╝</tspan>
  <tspan x="20" dy="14"> ██████╔╝██║   ██║██████╔╝   ██║   ██████╔╝███████║██║   ██║   </tspan>
  <tspan x="20" dy="14"> ██╔═══╝ ██║   ██║██╔══██╗   ██║   ██╔══██╗██╔══██║██║   ██║   </tspan>
  <tspan x="20" dy="14"> ██║     ╚██████╔╝██║  ██║   ██║   ██║  ██║██║  ██║██║   ██║   </tspan>
  <tspan x="20" dy="14"> ╚═╝      ╚═════╝ ╚═╝  ╚═╝   ╚═╝   ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝   ╚═╝   </tspan>
</text>

<!-- Animated terminal block art -->
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.4s" fill="freeze"/>
  <text xml:space="preserve" x="20" y="195" fill="#7d8590" font-size="10">  ┌─────────────────────────────────────────────────────────────────────┐</text>
  <text xml:space="preserve" x="20" y="209" fill="#7d8590" font-size="10">  │                                                                     │</text>
  <text xml:space="preserve" x="20" y="223" fill="#7d8590" font-size="10">  │   <tspan fill="#3fb950">$</tspan> <tspan fill="#c9d1d9">portrait.sh</tspan> <tspan fill="#f2cc60">--source source-prepped.png</tspan>                        │</text>
  <text xml:space="preserve" x="20" y="237" fill="#7d8590" font-size="10">  │                                                                     │</text>
  <text xml:space="preserve" x="20" y="251" fill="#7d8590" font-size="10">  │   <tspan fill="#ff5f56">Error:</tspan> <tspan fill="#c9d1d9">source-prepped.png not found</tspan>                              │</text>
  <text xml:space="preserve" x="20" y="265" fill="#7d8590" font-size="10">  │                                                                     │</text>
  <text xml:space="preserve" x="20" y="279" fill="#7d8590" font-size="10">  │   <tspan fill="#22d3ee">Hint:</tspan> <tspan fill="#c9d1d9">run prep_photo.py with your photo to generate</tspan>              │</text>
  <text xml:space="preserve" x="20" y="293" fill="#7d8590" font-size="10">  │         <tspan fill="#c9d1d9">source-prepped.png, then re-run make_ascii_svg.py</tspan>              │</text>
  <text xml:space="preserve" x="20" y="307" fill="#7d8590" font-size="10">  │                                                                     │</text>
  <text xml:space="preserve" x="20" y="321" fill="#7d8590" font-size="10">  └─────────────────────────────────────────────────────────────────────┘</text>
</g>

<!-- Big centered avatar-style graphic -->
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.5s" fill="freeze"/>
  <text x="410" y="420" fill="#22d3ee" font-size="100" text-anchor="middle" font-weight="700">AV</text>
  <text x="410" y="480" fill="#3fb950" font-size="22" text-anchor="middle" font-weight="700">Avi Vashishta</text>
  <text x="410" y="508" fill="#7d8590" font-size="14" text-anchor="middle">Software Engineer · Open Source</text>
</g>

<!-- Decorative scanlines -->
<g opacity="0.04">
  <rect y="50" width="820" height="1" fill="#c9d1d9"/>
  <rect y="80" width="820" height="1" fill="#c9d1d9"/>
  <rect y="110" width="820" height="1" fill="#c9d1d9"/>
  <rect y="140" width="820" height="1" fill="#c9d1d9"/>
  <rect y="170" width="820" height="1" fill="#c9d1d9"/>
  <rect y="200" width="820" height="1" fill="#c9d1d9"/>
  <rect y="230" width="820" height="1" fill="#c9d1d9"/>
  <rect y="260" width="820" height="1" fill="#c9d1d9"/>
  <rect y="290" width="820" height="1" fill="#c9d1d9"/>
  <rect y="320" width="820" height="1" fill="#c9d1d9"/>
  <rect y="350" width="820" height="1" fill="#c9d1d9"/>
  <rect y="380" width="820" height="1" fill="#c9d1d9"/>
  <rect y="410" width="820" height="1" fill="#c9d1d9"/>
  <rect y="440" width="820" height="1" fill="#c9d1d9"/>
  <rect y="470" width="820" height="1" fill="#c9d1d9"/>
  <rect y="500" width="820" height="1" fill="#c9d1d9"/>
  <rect y="530" width="820" height="1" fill="#c9d1d9"/>
  <rect y="560" width="820" height="1" fill="#c9d1d9"/>
  <rect y="590" width="820" height="1" fill="#c9d1d9"/>
  <rect y="620" width="820" height="1" fill="#c9d1d9"/>
  <rect y="650" width="820" height="1" fill="#c9d1d9"/>
  <rect y="680" width="820" height="1" fill="#c9d1d9"/>
  <rect y="710" width="820" height="1" fill="#c9d1d9"/>
  <rect y="740" width="820" height="1" fill="#c9d1d9"/>
  <rect y="770" width="820" height="1" fill="#c9d1d9"/>
  <rect y="800" width="820" height="1" fill="#c9d1d9"/>
</g>

<!-- Status bar -->
<line x1="0" y1="815" x2="820" y2="815" stroke="#30363d"/>
<text x="20" y="834" fill="#7d8590" font-size="13">avi@github:~$ whoami <tspan fill="#c9d1d9">Avi Vashishta</tspan></text>
<!-- blinking cursor -->
<rect x="216" y="822" width="8" height="14" fill="#c9d1d9">
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
</rect>
</svg>
