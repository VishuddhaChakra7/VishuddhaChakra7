name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI dependencies
        run: pip install -r scripts/requirements-ci.txt

      - name: Fetch contributions data
        run: python scripts/fetch_contributions.py

      - name: Render contribution heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Generate info card SVG
        run: python scripts/make_info_card.py

      - name: Generate ASCII portrait SVG
        run: |
          if [ -f source-prepped.png ]; then
            python scripts/make_ascii_svg.py
          else
            echo "source-prepped.png not found – skipping ASCII portrait generation"
          fi

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg info-card.svg avi-ascii.svg"